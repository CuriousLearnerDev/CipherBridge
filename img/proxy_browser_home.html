<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>密桥 CipherBridge — 代理浏览器</title>
  <style>
    :root {
      --bg: #0d0e10;
      --bar: rgba(24, 25, 29, 0.86);
      --panel: #16181d;
      --panel-2: #1c1f26;
      --line: #2a2d36;
      --line-soft: rgba(255, 255, 255, 0.06);
      --text: #e6e8ee;
      --muted: #8b8fa0;
      --accent: #6ea8fe;
      --accent-2: #9b7cff;
      --ok: #55c57a;
      --ok-glow: rgba(85, 197, 122, 0.55);
      --accent-glow: rgba(110, 168, 254, 0.22);
      --bar-h: 48px;
      --foot-h: 40px;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: grid;
      grid-template-rows: var(--bar-h) minmax(0, 1fr) var(--foot-h);
      position: relative;
    }

    /* —— 背景装饰：径向光晕 + 点阵 —— */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(600px 340px at 18% 12%, var(--accent-glow), transparent 68%),
        radial-gradient(560px 320px at 84% 82%, rgba(155, 124, 255, 0.12), transparent 66%);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.55;
      background-image: radial-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px);
      background-size: 26px 26px;
      mask-image: radial-gradient(ellipse 78% 64% at 50% 42%, #000 30%, transparent 74%);
    }

    /* —— 顶栏 —— */
    .topbar {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bar);
      backdrop-filter: blur(14px) saturate(1.4);
      border-bottom: 1px solid var(--line-soft);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .brand-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #7c5cff);
      box-shadow: 0 4px 14px rgba(80, 100, 255, 0.35);
    }
    .brand-mark svg { width: 17px; height: 17px; }
    .brand-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .brand-en {
      font-size: 12px;
      color: var(--muted);
      margin-left: 9px;
      padding-left: 9px;
      border-left: 1px solid var(--line);
      letter-spacing: 0.3px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 0 3px var(--ok-glow), 0 0 8px var(--ok);
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.82); }
    }

    /* —— 主舞台 —— */
    .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 26px 28px;
      overflow: hidden;
    }
    .stage-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }
    .stage-title .rule {
      width: 26px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line));
    }
    .stage-title .rule:last-child {
      background: linear-gradient(90deg, var(--line), transparent);
    }

    .figure {
      position: relative;
      margin: 0;
      max-width: 100%;
      max-height: 100%;
      border-radius: var(--radius);
      padding: 10px;
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.02) inset;
    }
    /* 顶部装饰亮条 */
    .figure::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      right: 12%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(110, 168, 254, 0.75), transparent);
    }
    .figure img {
      display: block;
      width: auto;
      height: auto;
      max-width: min(1120px, 90vw);
      max-height: calc(100vh - var(--bar-h) - var(--foot-h) - 110px);
      object-fit: contain;
      border-radius: calc(var(--radius) - 5px);
    }
    .figure figcaption {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 4px 4px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.4px;
    }
    .figure figcaption svg { width: 13px; height: 13px; opacity: 0.7; }

    .hints {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .hint-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--muted);
      padding: 5px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.025);
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .hint-chip:hover { border-color: var(--accent); color: var(--text); }
    .hint-chip svg { width: 12px; height: 12px; opacity: 0.75; }

    /* —— 进场动画 —— */
    .topbar, .stage-title, .figure, .hints, .footer {
      animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .stage-title { animation-delay: 0.04s; }
    .figure { animation-delay: 0.1s; }
    .hints { animation-delay: 0.18s; }
    .footer { animation-delay: 0.24s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
      .topbar, .stage-title, .figure, .hints, .footer { animation: none; }
    }

    /* —— 底栏 —— */
    .footer {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--line-soft);
      background: var(--bar);
      backdrop-filter: blur(14px) saturate(1.4);
    }
    .footer .keys {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .footer kbd {
      font-family: "Consolas", "Menlo", monospace;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 5px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l8 3v6c0 5-3.4 8.6-8 11-4.6-2.4-8-6-8-11V5z"/>
          <circle cx="12" cy="10" r="2.4"/>
          <path d="M12 12.4V15"/>
        </svg>
      </span>
      <span class="brand-name">密桥</span>
      <span class="brand-en">CipherBridge · 代理浏览器</span>
    </div>
    <div class="status">
      <span class="dot"></span>
      <span>已就绪 · 流量经解密端代理</span>
    </div>
  </header>

  <main class="stage">
    <div class="stage-title">
      <span class="rule"></span>
      部署拓扑
      <span class="rule"></span>
    </div>

    <figure class="figure">
      <img
        src="e2f83ef5-edda-4dbf-a8f0-cf24bbc920aa.png"
        alt="部署拓扑"
      />
      <figcaption>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        浏览器 → 解密代理 → 上游站点
      </figcaption>
    </figure>

    <div class="hints">
      <span class="hint-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        自动发现请求密钥
      </span>
      <span class="hint-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
        </svg>
        支持加解密改写
      </span>
      <span class="hint-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        AES · SM4 · RSA 等
      </span>
    </div>
  </main>

  <p class="footer">
    <span>在地址栏输入目标站点开始调试 · 关闭窗口即退出</span>
    <span class="keys"><kbd>Ctrl</kbd>+<kbd>L</kbd> 定位地址栏</span>
  </p>
</body>
</html>
